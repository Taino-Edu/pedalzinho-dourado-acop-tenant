services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autosuite}
      POSTGRES_USER: ${POSTGRES_USER:-autosuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - autosuite_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autosuite} -d ${POSTGRES_DB:-autosuite}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    container_name: concessionaria_${CLIENT_SLUG:-local}_app
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-autosuite}:${POSTGRES_PASSWORD:-change-this-database-password}@db:5432/${POSTGRES_DB:-autosuite}?schema=public
      # Vitrine publica por padrao. Defina SHOWCASE_MODE=false no .env para
      # exigir as credenciais abaixo.
      SHOWCASE_MODE: ${SHOWCASE_MODE:-true}
      DASHBOARD_USER: ${DASHBOARD_USER:-dealer}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-change-this-dashboard-password}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-change-this-session-secret}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin-geral}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-change-this-platform-password}
      PLATFORM_ADMIN_SESSION_SECRET: ${PLATFORM_ADMIN_SESSION_SECRET:-change-this-platform-session-secret}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      default:
      proxy:
        aliases:
          - concessionaria_${CLIENT_SLUG:-local}_app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/branding"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  autosuite_postgres_data:

networks:
  proxy:
    name: ${PROXY_NETWORK:-deploy_cardgame_network}
    external: true
